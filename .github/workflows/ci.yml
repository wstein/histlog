name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        elixir:
          - "1.18.4"
        otp:
          - "27.3"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Cache Mix dependencies
        uses: actions/cache@v5
        with:
          path: |
            app/deps
            app/_build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('app/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: cd app && mix deps.get

      - name: Run CI
        run: make ci

      - name: Smoke test executable
        run: |
          ./app/histlog --help
          ./app/histlog sync --root "$RUNNER_TEMP/histlog-smoke" --date 2026-05-07

      - name: Upload executable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: histlog-${{ matrix.os }}
          path: |
            app/histlog
            app/histlog.escript
            app/_build/dev/lib
          if-no-files-found: error
